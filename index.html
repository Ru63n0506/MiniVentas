<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniVentas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#101713">
</head>
<body>

    <header>
        <h1>MiniVentas</h1>
    </header>

    <main>
        <p>Registro de ventas</p>

        <section class="resumen">
            <div class="indicador">
                <h3>Ventas registradas</h3>
                <p id="totalVentas">0</p>
            </div>

            <div class="indicador">
                <h3>Productos vendidos</h3>
                <p id="totalProductos">0</p>
            </div>

            <div class="indicador">
                <h3>Ingresos totales</h3>
                <p id="ingresosTotales">$0.00</p>
            </div>
        </section>

        <section class="tarjeta">
            <h2>Nueva venta</h2>

            <form id="formularioVenta">
                <label for="producto">Producto</label>
                <input type="text" id="producto" required>

                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" min="1" required>

                <label for="precio">Precio unitario</label>
                <input type="number" id="precio" min="0.01" step="0.01" required>

                <button type="submit">Registrar venta</button>
            </form>
        </section>
    
        <section class="tarjeta historial">
            <h2>Historial de ventas</h2>

            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody id="listaVentas">
                </tbody>
            </table>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
